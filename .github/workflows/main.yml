name: Build SAFWAN AI Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter opencv-python-headless pillow pyttsx3 psutil

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "config.json;." main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SAFWAN-AI-Windows-Executable
        path: dist/main/
